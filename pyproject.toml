[project]
name = "depfix-mcp"
version = "0.1.0"
description = "Verification-first assistant for migrating deprecated API usage"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
]

[project.scripts]
depfix = "depfix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/depfix"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "hypothesis>=6.100,<7",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]
# numpy is only needed so the benchmark can run NumPy-2 cases. It is not a runtime dependency.
bench = ["numpy>=2.0,<3"]

[tool.uv]
default-groups = ["dev", "bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["benchmark/cases"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "benchmark"]
exclude = ["benchmark/cases"]
